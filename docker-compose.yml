version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Container for User & App Data
  # ----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: engineering-suite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_secure_password_2026
    # Plain TCP: this machine only (DDS-SRS-074). The app reaches it on the
    # compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 1a. Redis - stores data the app used to keep in each user's
  #     browser (test management first), and caches reads. AOF with
  #     an fsync every second, so a restart loses at most ~1 s of writes.
  # ----------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: devdoc-studio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 1b. API (FastAPI, backend/) — real authentication and shared
  #     document storage. The frontend only calls it when
  #     VITE_API_BASE_URL is set at build time; without it the app
  #     still runs as a browser-only demo, unchanged.
  # ----------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devdoc-studio-api
    restart: unless-stopped
    # Browsers reach the API through web-app's HTTPS (/api/). This plain-HTTP
    # port is for this machine only - the dev server and local tools.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql://platform_admin:platform_secure_password_2026@postgres-db:5432/platform_db
      - REDIS_URL=redis://redis:6379/0
      # The HTTPS app is the same origin as the API behind it; the dev server
      # (web-app-dev, plain HTTP on this machine) still calls it directly.
      - CORS_ORIGINS=https://localhost:${HTTPS_PORT:-8443},http://localhost:5174
      # Session cookies only travel over HTTPS (DDS-SRS-074).
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Optional: set in your shell or a root .env before `docker compose up`
      # to let the frontend's AI rephrase feature use this server as a key-
      # holding proxy instead of a per-browser key. Unset by default.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Encrypts stored test-server credentials (see backend/.env.example).
      - SECRETS_KEY=${SECRETS_KEY:-}
      # The code editor's file bridge, for connecting existing repositories
      # (DDS-SRS-030). Set BRIDGE_TOKEN (any long random string) in a root .env:
      # without it the bridge's git endpoints accept anyone who can reach port 8081.
      - BRIDGE_URL=http://vscode-cline:8081
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      # JWT access tokens and single sign-on (DDS-SRS-076); see backend/.env.example.
      - JWT_SECRET=${JWT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-}
      - OIDC_POST_LOGIN_URL=${OIDC_POST_LOGIN_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  # ----------------------------------------------------
  # 2. DocCraft Studio & Operations Web Application
  # ----------------------------------------------------
  web-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Defaults to how the api service is reachable from the host (and
        # so from your browser) with this compose file's own port mapping -
        # docker compose up now produces a frontend that can actually reach
        # the backend, not just one running next to it. Override in your
        # shell or a root .env for a different deployment.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://localhost:8443}
    container_name: devdoc-studio-app
    restart: unless-stopped
    # HTTPS, TLS 1.3 (DDS-SRS-074): https://localhost:8443. The old
    # http://localhost:5173 now only redirects there.
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "5173:80"
    volumes:
      # Your certificate as tls.crt + tls.key; without one a self-signed
      # certificate is made at start (frontend/docker/15-devdoc-tls.sh).
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Same origin as the build arg above, so the CSP (see
      # nginx.conf.template) actually allows the frontend to call it.
      - BACKEND_ORIGIN=${VITE_API_BASE_URL:-https://localhost:8443}
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - TLS_HOSTNAME=${TLS_HOSTNAME:-localhost}

  # ----------------------------------------------------
  # 2b. Dev server (hot reload) — opt-in via `--profile dev`,
  #     so it never collides with web-app's port 5173 unless asked for.
  #     Run with: docker compose --profile dev up web-app-dev
  # ----------------------------------------------------
  web-app-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: devdoc-studio-app-dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's own (Linux) node_modules
      # aren't clobbered by the host's bind mount — the host's copy may
      # have macOS/Windows-specific native binaries (esbuild, rollup,
      # oxlint) that won't run inside the Linux container.
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # ----------------------------------------------------
  # 3. VS Code + Cline (Claude Agent) QA Sandbox VM
  # ----------------------------------------------------
  vscode-cline:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: devdoc-vscode-cline
    restart: unless-stopped
    # Browsers reach code-server and the bridge through web-app's HTTPS
    # (/vscode/, /bridge/); these plain ports are for this machine only.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-""}
      - DATABASE_URL=postgres://platform_admin:platform_secure_password_2026@postgres-db:5432/platform_db
      # Same value as the api service's: required by the bridge's git endpoints when set.
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      # The code editor's password (it gives a terminal). Set one in a root .env;
      # without it a random password is made and printed in this container's
      # log: docker compose logs vscode-cline | grep password
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-}
      - CODE_SERVER_HASHED_PASSWORD=${CODE_SERVER_HASHED_PASSWORD:-}
    volumes:
      - ./workspace-qa:/home/coder/project

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
