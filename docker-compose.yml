version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Container for User & App Data
  # ----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: engineering-suite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 1a. Redis - stores data the app used to keep in each user's
  #     browser (test management first), and caches reads. AOF with
  #     an fsync every second, so a restart loses at most ~1 s of writes.
  # ----------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: devdoc-studio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 1b. API (FastAPI, backend/) — real authentication and shared
  #     document storage. The frontend only calls it when
  #     VITE_API_BASE_URL is set at build time; without it the app
  #     still runs as a browser-only demo, unchanged.
  # ----------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devdoc-studio-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - DATABASE_URL=postgresql://platform_admin:platform_secure_password_2026@postgres-db:5432/platform_db
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173
      # Optional: set in your shell or a root .env before `docker compose up`
      # to let the frontend's AI rephrase feature use this server as a key-
      # holding proxy instead of a per-browser key. Unset by default.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Encrypts stored test-server credentials (see backend/.env.example).
      - SECRETS_KEY=${SECRETS_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  # ----------------------------------------------------
  # 2. DocCraft Studio & Operations Web Application
  # ----------------------------------------------------
  web-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Defaults to how the api service is reachable from the host (and
        # so from your browser) with this compose file's own port mapping -
        # docker compose up now produces a frontend that can actually reach
        # the backend, not just one running next to it. Override in your
        # shell or a root .env for a different deployment.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: devdoc-studio-app
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      postgres-db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # Same origin as the build arg above, so the CSP (see
      # nginx.conf.template) actually allows the frontend to call it.
      - BACKEND_ORIGIN=${VITE_API_BASE_URL:-http://localhost:8000}

  # ----------------------------------------------------
  # 2b. Dev server (hot reload) — opt-in via `--profile dev`,
  #     so it never collides with web-app's port 5173 unless asked for.
  #     Run with: docker compose --profile dev up web-app-dev
  # ----------------------------------------------------
  web-app-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: devdoc-studio-app-dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's own (Linux) node_modules
      # aren't clobbered by the host's bind mount — the host's copy may
      # have macOS/Windows-specific native binaries (esbuild, rollup,
      # oxlint) that won't run inside the Linux container.
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # ----------------------------------------------------
  # 3. VS Code + Cline (Claude Agent) QA Sandbox VM
  # ----------------------------------------------------
  vscode-cline:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: devdoc-vscode-cline
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-""}
      - DATABASE_URL=postgres://platform_admin:platform_secure_password_2026@postgres-db:5432/platform_db
    volumes:
      - ./workspace-qa:/home/coder/project

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
