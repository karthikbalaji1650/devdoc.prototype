name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Only for tests/test_postgres.py (the real SQL); everything else runs
    # on in-memory repositories.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devdoc
          POSTGRES_PASSWORD: devdoc
          POSTGRES_DB: devdoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devdoc -d devdoc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://devdoc:devdoc@localhost:5432/devdoc_test
        run: uv run pytest

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # e2e/backend-login.spec.ts and remote-test-execution.spec.ts start
      # the real API (backend/tests/e2e_server.py, in-memory storage) to
      # check the frontend and API together.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser and accessibility tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Builds and publishes a deployable image on every main push, once the
  # three jobs above have verified it. There's no live infrastructure
  # for this project yet to deploy onto, so "deploy from CI" means this:
  # a ready-to-run image appears automatically, instead of being a
  # manual `docker build` someone has to remember to do. Actually
  # running it on a server is still a separate, later step (see
  # backend/README.md and the root README's Docker section).
  publish-images:
    needs: [verify, backend-tests, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The default docker driver can't export a build cache; the GHA
      # cache backend used below needs the docker-container driver.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web-app
          cache-to: type=gha,mode=max,scope=web-app

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
