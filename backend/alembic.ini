# Alembic: versioned schema migrations for the API's Postgres.
# The database URL is not set here: migrations/env.py reads DATABASE_URL
# (the same variable the API uses), so no credentials live in this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 0001_baseline, 0002_... : readable order, and no timestamps to conflict on.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
